- type: entity
  name: chair
  id: SeatBase
  abstract: true
  description: You sit in this. Either by will or force.
  placement:
    mode: PlaceFree
  components:
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - TableMask
  - type: Sprite
    sprite: Structures/Furniture/chairs.rsi
    noRot: true
  - type: Strap
    position: Stand
    buckleOffset: "0,-0.05"
  - type: Pullable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: StaticPrice
    price: 50
  - type: RequireProjectileTarget

#Starts unanchored, cannot be rotated while anchored
- type: entity
  name: chair
  id: UnanchoredChairBase
  parent: SeatBase
  abstract: true
  components:
  - type: Anchorable
  - type: Rotatable

#Start anchored, cannot be rotated while anchored
- type: entity
  name: chair
  id: ChairBase
  abstract: true
  parent: UnanchoredChairBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true

#Starts unanchored, can be rotated while anchored
- type: entity
  name: chair
  id: OfficeChairBase
  parent: UnanchoredChairBase
  abstract: true
  components:
  - type: Rotatable
    rotateWhileAnchored: true

- type: entity
  name: chair
  id: RollingOfficeChairBase
  description: Scoot from desk to desk because standing is for interns.
  parent: BaseVehicle
  abstract: true
  components:
  - type: Anchorable
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Sprite
    sprite: Structures/Furniture/chairs.rsi
    noRot: true
  - type: Strap
    position: Stand
    buckleOffset: "0,-0.05"
  - type: Vehicle
    requiredHands: 0
    engineRunning: true
    renderOver: South, SouthEast, SouthWest
  - type: MovementSpeedModifier
    acceleration: 10
    friction: 3.5
    baseSprintSpeed: 2.5
    baseWalkSpeed: 1.5
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 75
        mask:
        - TableMask
  - type: StaticPrice
    price: 50

#Starts anchored, can be rotated while anchored
- type: entity
  name: stool
  id: StoolBase
  parent: OfficeChairBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true

- type: entity
  name: chair
  id: Chair
  parent: EmberSeatBase
  components:
  - type: Sprite
    state: chair_preview
  - type: EmberProceduralFurniture
    baseState: chair
    material: Steel
  - type: Construction
    graph: Seat
    node: chair

- type: entity
  name: chair
  id: ChairGreyscale
  parent: Chair
  suffix: White
  components:
  - type: Sprite
    state: chair_preview
  # Ванильный «серый» стул существовал, чтобы его перекрашивали целиком. Здесь красить нечего: цвет у стула
  # берётся из материала каркаса и обивки, поэтому белый — это стул с белой тканью на сиденье.
  - type: EmberProceduralFurniture
    baseState: chair
    material: Steel
    padding: Cloth

- type: entity
  name: stool
  id: Stool
  parent: EmberLooseSeatBase
  description: Apply butt.
  components:
  - type: Sprite
    state: stool_preview
  - type: EmberProceduralFurniture
    baseState: stool
    material: Steel
  - type: Construction
    graph: Seat
    node: stool

- type: entity
  name: bar stool
  id: StoolBar
  parent: EmberSeatBase
  components:
  - type: Sprite
    state: bar_stool_preview
  - type: EmberProceduralFurniture
    baseState: bar_stool
    material: Steel
  - type: Construction
    graph: Seat
    node: stoolBar

- type: entity
  name: brass chair
  id: ChairBrass
  parent: StoolBase
  components:
  - type: Sprite
    state: brass_chair
  - type: Construction
    graph: Seat
    node: chairBrass

- type: entity
  name: white office chair
  id: ChairOfficeLight
  parent: EmberLooseSeatBase
  components:
  - type: Sprite
    state: officechair_preview
  - type: EmberProceduralFurniture
    baseState: officechair
    material: Steel
    padding: Cloth
  # Bay's office chair is five sheets (stack_recipe/furniture/chair/office), where the vanilla one was two, and
  # a chair worth less than the steel in it is a licence to print money at the nearest autolathe.
  - type: StaticPrice
    price: 75
  - type: Construction
    graph: Seat
    node: chairOffice
  - type: SpawnItemsAtLocationOnUse
    spawnItemsVerbText: disable-wheel-locks
    items:
    - id: ChairOfficeLightRolling

- type: entity
  name: dark office chair
  id: ChairOfficeDark
  parent: ChairOfficeLight
  components:
  - type: Sprite
    state: officechair_preview
  - type: EmberProceduralFurniture
    baseState: officechair
    material: Steel
    padding: Leather
  - type: Construction
    graph: Seat
    node: chairOfficeDark
  - type: SpawnItemsAtLocationOnUse
    spawnItemsVerbText: disable-wheel-locks
    items:
    - id: ChairOfficeDarkRolling

# EE start

- type: entity
  name: white office chair
  suffix: No mapping
  id: ChairOfficeLightRolling
  parent: RollingOfficeChairBase
  components:
  - type: Sprite
    state: office-white
  # Unlocking the wheels does not melt two sheets of steel down, so it is worth what the standing one is.
  - type: StaticPrice
    price: 75
  - type: Construction
    graph: Seat
    node: chairOffice
  - type: SpawnItemsAtLocationOnUse
    spawnItemsVerbText: activate-wheel-locks
    items:
    - id: ChairOfficeLight

- type: entity
  name: dark office chair
  suffix: No mapping
  id: ChairOfficeDarkRolling
  parent: ChairOfficeLightRolling
  components:
  - type: Sprite
    state: office-dark
  - type: Construction
    graph: Seat
    node: chairOfficeDark
  - type: SpawnItemsAtLocationOnUse
    spawnItemsVerbText: activate-wheel-locks
    items:
    - id: ChairOfficeDark

# EE end

- type: entity
  name: comfy chair
  id: ComfyChair
  parent: EmberSeatBase
  description: It looks comfy.
  components:
  - type: Sprite
    state: comfychair_preview
  - type: EmberProceduralFurniture
    baseState: comfychair
    material: Steel
    padding: Carpet
  - type: Construction
    graph: Seat
    node: chairComfy

- type: entity
  name: pilot seat
  id: ChairPilotSeat
  parent: EmberSeatBase
  description: The pilot seat of a prestigious ship.
  components:
  - type: Sprite
    state: shuttle_chair_preview
  # Ремни у шаттлового кресла — это его же металл, а не отдельная деталь, поэтому красятся вместе с ним.
  # Пока никто не пристёгнут, они висят открытыми; как только пристегнулись, кресло целиком меняет набор
  # деталей на shuttle_chair-b, у которого вместо открытых ремней сомкнутые подлокотники.
  - type: EmberProceduralFurniture
    baseState: shuttle_chair
    occupiedState: shuttle_chair-b
    material: Steel
    padding: Cloth
    special: true
    specialTinted: true
    specialWhenOccupied: false
  - type: Construction
    graph: Seat
    node: chairPilotSeat

- type: entity
  name: wooden chair
  id: ChairWood
  parent: EmberLooseSeatBase
  components:
  - type: Sprite
    state: wooden_chair_preview
  - type: EmberProceduralFurniture
    baseState: wooden_chair
    material: Wood
  - type: Construction
    graph: Seat
    node: chairWood
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1
            max: 1
  - type: Tag
    tags:
    - Wooden
  - type: StaticPrice
    price: 75

