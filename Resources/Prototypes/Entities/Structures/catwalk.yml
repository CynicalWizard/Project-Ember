# TODO move this to tiles once tile smoothing is supported
- type: entity
  id: Catwalk
  name: catwalk
  description: A catwalk for easier EVA maneuvering and cable placement.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: Structures/catwalk.rsi
    drawdepth: FloorTiles
  - type: Icon
    sprite: Structures/catwalk.rsi
    state: catwalk_preview
  - type: Transform
    anchored: true
  - type: IconSmooth
    key: catwalk
    base: catwalk_
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8
  - type: Tag
    tags:
      - Catwalk
  - type: Construction
    graph: Catwalk
    node: Catwalk
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal: # takes two to construct, so drop less than that
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TrayScanReveal
  - type: RCDDeconstructable
    cost: 2
    delay: 2
    fx: EffectRCDDeconstruct2

# Плитка, положенная поверх решётки. У Bay это /obj/catwalk_plated — спавнер, который на загрузке карты
# исчезает и оставляет после себя обычный catwalk с plated_tile внутри; сама плитка рисуется одним плоским
# слоем поверх сглаженной решётки и красится цветом того тайла, из которого сделана.
#
# Сглаживание пишет только в нулевой слой, поэтому решётка остаётся им, а плитка ложится следующим.
- type: entity
  id: CatwalkPlated
  parent: Catwalk
  name: plated catwalk
  description: A catwalk with floor tiles laid over it.
  components:
  - type: Sprite
    layers:
    - sprite: Structures/catwalk.rsi
      state: catwalk_0
    - sprite: Ember/Structures/catwalk_plated.rsi
      state: plated
  - type: Icon
    sprite: Ember/Structures/catwalk_plated.rsi
    state: plated

- type: entity
  id: CatwalkPlatedDark
  parent: CatwalkPlated
  suffix: Dark
  components:
  - type: Sprite
    layers:
    - sprite: Structures/catwalk.rsi
      state: catwalk_0
    - sprite: Ember/Structures/catwalk_plated.rsi
      state: plated
      color: "#404040"

- type: entity
  id: CatwalkPlatedWhite
  parent: CatwalkPlated
  suffix: White
  components:
  - type: Sprite
    layers:
    - sprite: Structures/catwalk.rsi
      state: catwalk_0
    - sprite: Ember/Structures/catwalk_plated.rsi
      state: plated
      color: "#eeeeee"
