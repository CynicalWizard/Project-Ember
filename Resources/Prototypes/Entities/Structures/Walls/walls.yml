# Стены собраны в одну ветку меню маппинга. Своего имени у категории нет намеренно:
# половина стен не задаёт имени и берёт его у родителя, так что названная категория
# переименовала бы их все. Дерево показывает идентификатор и локализует его.
- type: entity
  abstract: true
  id: EmberWallCategory

- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseWall
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: MetalBulletImpact
    soundTypes:
      Heat:
        collection: MetalLaserImpact
  - type: Tag
    tags:
    - Wall
  - type: IsRoof
  - type: Sprite
    drawdepth: Walls
  - type: Icon
    state: full
  - type: PlacementReplacement
    key: walls
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Occluder
  - type: Airtight
  - type: StaticPrice
    price: 75
  - type: RadiationBlocker
    resistance: 1
  - type: BlockWeather

- type: entity
  parent: BaseWall
  id: WallBrick
  components:
  - type: Sprite
    sprite: Structures/Walls/brick.rsi
  - type: Icon
    sprite: Structures/Walls/brick.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

  - type: IconSmooth
    key: bricks
    base: brick

