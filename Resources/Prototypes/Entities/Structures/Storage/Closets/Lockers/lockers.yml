# Freezer
- type: entity
  id: LockerFreezerBase
  parent: LockerBase
  name: freezer
  suffix: No Access
  components:
  - type: Appearance
  - type: Sprite
    noRot: true
    sprite: Ember/Structures/Storage/fridge.rsi
    layers:
    - state: closed
      map: ["enum.StorageVisualLayers.Base"]
    - state: blank
      map: ["enum.StorageVisualLayers.Door"]
    - state: closed_unlocked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      offset: "-0.065,0"
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: EntityStorageVisuals
    stateBaseClosed: closed
    stateBaseOpen: open
  - type: LockVisuals
    stateLocked: closed_locked
    stateUnlocked: closed_unlocked
  - type: EmberMaterialComposition
    materials:
    - Steel
  - type: ExplosionResistance
    damageCoefficient: 0.50
  - type: AntiRottingContainer
  - type: Construction
    graph: ClosetFreezer
    node: done
    containers:
    - entity_storage

