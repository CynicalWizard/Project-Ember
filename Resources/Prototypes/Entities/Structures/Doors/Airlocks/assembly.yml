#Clockwork
- type: entity
  id: PinionAirlockAssembly
  name: airlock assembly
  suffix: Pinion, Clockwork
  parent: BaseAirlockAssembly
  components:
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/clockwork_pinion.rsi
    layers:
    - state: assembly
  - type: Construction
    graph: PinionAirlock
    node: assembly
  placement:
    mode: SnapgridCenter

- type: entity
  parent: BaseAirlockAssembly
  id: PinionAirlockAssemblyGlass
  suffix: Pinion, Clockwork, Glass
  components:
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Glass/clockwork_pinion.rsi
    layers:
    - state: assembly
  - type: Construction
    graph: PinionAirlock
    node: assembly

