- type: entity
  parent: AirlockRCDResistant
  id: AirlockExternal
  suffix: External
  description: It opens, it closes, it might crush you, and there might be only space behind it.
  components:
  - type: Door
    openingAnimationTime: 1.2
    closingAnimationTime: 1.2
    crushDamage:
      types:
        Blunt: 15
    openSound:
      path: /Audio/Machines/airlock_ext_open.ogg
    closeSound:
      path: /Audio/Machines/airlock_ext_close.ogg
    denySound:
      path: /Audio/Machines/airlock_deny.ogg
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/external.rsi
  - type: EmberProceduralAirlock
    style: EmberAirlockExternal
    doorSprite: /Textures/Ember/Structures/Doors/Airlocks/External/door.rsi
    colorSprite: /Textures/Ember/Structures/Doors/Airlocks/External/color.rsi
    colorFillSprite: /Textures/Ember/Structures/Doors/Airlocks/External/fill_color.rsi
    steelFillSprite: /Textures/Ember/Structures/Doors/Airlocks/External/fill_steel.rsi
    glassFillSprite: /Textures/Ember/Structures/Doors/Airlocks/External/fill_glass.rsi
    greenLightsSprite: /Textures/Ember/Structures/Doors/Airlocks/External/lights_green.rsi
    denyLightsSprite: /Textures/Ember/Structures/Doors/Airlocks/External/lights_deny.rsi
    boltLightsSprite: /Textures/Ember/Structures/Doors/Airlocks/External/lights_bolts.rsi
    emagSprite: /Textures/Ember/Structures/Doors/Airlocks/External/emag.rsi
  - type: PaintableAirlock
    group: External
    department: null
  - type: Wires
    layoutId: AirlockExternal

- type: entity
  parent: AirlockExternal
  id: AirlockExternalGlass
  suffix: Glass, External
  components:
  - type: Door
    occludes: false
    openingAnimationTime: 1.2
    closingAnimationTime: 1.2
  - type: Occluder
    enabled: false
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Glass/external.rsi
  - type: EmberProceduralAirlock
    style: EmberAirlockExternal
    glass: true
    doorSprite: /Textures/Ember/Structures/Doors/Airlocks/External/door.rsi
    colorSprite: /Textures/Ember/Structures/Doors/Airlocks/External/color.rsi
    colorFillSprite: /Textures/Ember/Structures/Doors/Airlocks/External/fill_color.rsi
    steelFillSprite: /Textures/Ember/Structures/Doors/Airlocks/External/fill_steel.rsi
    glassFillSprite: /Textures/Ember/Structures/Doors/Airlocks/External/fill_glass.rsi
    greenLightsSprite: /Textures/Ember/Structures/Doors/Airlocks/External/lights_green.rsi
    denyLightsSprite: /Textures/Ember/Structures/Doors/Airlocks/External/lights_deny.rsi
    boltLightsSprite: /Textures/Ember/Structures/Doors/Airlocks/External/lights_bolts.rsi
    emagSprite: /Textures/Ember/Structures/Doors/Airlocks/External/emag.rsi
  - type: PaintableAirlock
    group: ExternalGlass
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49" # don't want this colliding with walls or they won't close
        density: 100
        mask:
        - FullTileMask
        layer:     #removed opaque from the layer, allowing lasers to pass through glass airlocks
        - GlassAirlockLayer
