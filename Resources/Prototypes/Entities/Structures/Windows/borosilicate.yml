- type: entity
  parent: PhoronWindow
  id: BorosilicateWindow
  name: borosilicate window
  components:
  - type: EmberProceduralStructure
    role: Window
    material: EmberBorosilicateGlass
    stateBase: window
    alpha: 0.7058824
    sprite: /Textures/Ember/Structures/Windows/window.rsi
  - type: Construction
    graph: Window
    node: borosilicateWindow

- type: entity
  parent: PhoronWindowDirectional
  id: BorosilicateWindowDirectional
  name: directional borosilicate window
  components:
  - type: EmberMaterialTint
    material: EmberBorosilicateGlass
    alpha: 0.7058824
  - type: Construction
    graph: WindowDirectional
    node: borosilicateWindowDirectional

# Bay's /obj/structure/window/boron_reinforced: borosilicate glass with a steel lattice. It is what the station
# window spawners actually place, and what phoron windows here were standing in for.
- type: entity
  parent: PhoronWindow
  id: ReinforcedBorosilicateWindow
  name: reinforced borosilicate window
  description: A pane of borosilicate glass held together by a steel lattice.
  components:
  - type: Icon
    sprite: Ember/Structures/Windows/window.rsi
    state: rwindow_full
  - type: EmberProceduralStructure
    role: Window
    material: EmberBorosilicateGlass
    stateBase: rwindow
    alpha: 0.7058824
    sprite: /Textures/Ember/Structures/Windows/window.rsi
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 2
  - type: Construction
    graph: Window
    node: reinforcedBorosilicateWindow
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: PhoronWindowDirectional
  id: ReinforcedBorosilicateWindowDirectional
  name: directional reinforced borosilicate window
  description: A pane of borosilicate glass held together by a steel lattice.
  components:
  - type: Sprite
    sprite: Ember/Structures/Windows/window.rsi
    state: rwindow
  - type: Icon
    sprite: Ember/Structures/Windows/window.rsi
    state: rwindow
  - type: EmberMaterialTint
    material: EmberBorosilicateGlass
    alpha: 0.7058824
  - type: Construction
    graph: WindowDirectional
    node: reinforcedBorosilicateWindowDirectional
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
    - trigger:
        !type:DamageTrigger
        damage: 37
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

