- type: entity
  id: MiningWindow
  name: mining window
  parent: WindowRCDResistant
  components:
  - type: Sprite
    drawdepth: Objects
    sprite: Ember/Structures/Windows/window.rsi
  - type: Icon
    sprite: Ember/Structures/Windows/window.rsi
    state: rwindow_full
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 3
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: RGlass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: EmberProceduralStructure
    role: Window
    material: EmberMiningGlass
    stateBase: rwindow
    alpha: 0.7058824
    sprite: /Textures/Ember/Structures/Windows/window.rsi
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 4

    trackAllDamage: true
    damageOverlay:
      sprite: Ember/Structures/Windows/window_damage_overlay.rsi
  - type: StaticPrice
    price: 100
  - type: EmberMaterialReinforcement
    material: Steel
