- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckChameleon
  # Ember: scarves are accessories now, so a neck chameleon can no longer disguise itself as one.
  name: tie
  description: A neosilk clip-on tie.
  suffix: Chameleon
  components:
    - type: Tag
      tags: [] # ignore "WhitelistChameleon" tag
    - type: Sprite
      sprite: Clothing/Neck/Ties/color.rsi
    - type: Clothing
      sprite: Clothing/Neck/Ties/color.rsi
    - type: ChameleonClothing
      slot: [neck]
      default: ClothingNeckTieColor
    - type: UserInterface
      interfaces:
        enum.ChameleonUiKey.Key:
          type: ChameleonBoundUserInterface
