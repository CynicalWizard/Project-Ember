- type: entity
  abstract: true
  parent: Clothing
  id: ClothingNeckBase
  components:
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: true
    slots:
    - neck
  - type: Sprite
    state: icon
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 2
  - type: Food
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Fiber
          Quantity: 10
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon

# Ember: a scarf is an accessory that goes on a uniform or coat, not a neck garment.
# It keeps the cloth behaviour ClothingNeckBase used to give it, minus the Clothing component.
- type: entity
  abstract: true
  parent: EmberClothingAccessoryBase
  id: ClothingScarfBase
  components:
  - type: EmberAccessory
    slot: Decor
    # Reuse the ordinary onmob sprite, drawn over the clothing it is attached to.
    equippedState: equipped-NECK
    # Bay hides an accessory once the suit covers its body_location, and a scarf on a uniform is
    # drawn below the outer clothing layer anyway - so under a coat it is a layer nobody sees.
    # Flip this off if an open jacket ought to show the scarf through it.
    hideUnderOuterClothing: true
    # A uniform pulled down to the waist bares the chest, which is why most accessories stop
    # being drawn there. A scarf is round the neck and does not go anywhere.
    visibleWhenRolledDown: true
  - type: TemperatureProtection
    heatingCoefficient: 1.025
    coolingCoefficient: 0.8
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 2
  - type: Food
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Fiber
          Quantity: 10
  - type: Tag
    tags:
    - Scarf
    - ClothMade
    - WhitelistChameleon
