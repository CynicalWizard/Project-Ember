- type: entity
  abstract: true
  parent: BaseItem
  id: PartBase
  components:
  - type: Sprite
    sprite: Objects/Materials/parts.rsi
    state: rods
  - type: Item
    sprite: Objects/Materials/parts.rsi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: FlimsyMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: PartBase
  id: PartRodMetal
  name: steel rods
  suffix: Full
  components:
  - type: PhysicalComposition
    materialComposition:
      Steel: 50 #Half of a regular steel sheet to reflect the crafting recipe
  - type: Stack
    stackType: MetalRod
    baseLayer: base
    layerStates: [ rod, rod-mult, rod-max ]
  # Ember: the same sheet every other metal's rods are drawn from, so a pile of steel rods and a pile of copper
  # ones are the same object in two colours rather than two unrelated sprites.
  - type: Sprite
    sprite: Ember/Objects/Materials/materials.rsi
    state: rod-max
    layers:
    - state: rod-max
      map: ["base"]
  - type: Item
    size: Normal
    heldPrefix: rods
  - type: Construction
    graph: MetalRod
    node: MetalRod
  # Ember: ties the vanilla steel rods to the material line, so putting them against a low wall assembles a
  # steel grille the same way every other metal does.
  - type: EmberMaterialStack
    material: Steel
    renameEntity: false
    countedName: ember-rod-steel
    countedDescription: ember-rod-desc
  - type: Appearance
  - type: FloorTile
    outputs:
    - Lattice
    - FloorReinforced
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 7.5
  - type: Extractable
    grindableSolutionName: rod
  - type: SolutionContainerManager
    solutions:
      rod:
        reagents:
        - ReagentId: Iron
          Quantity: 4.5
        - ReagentId: Carbon
          Quantity: 0.5
  - type: UserInterface
    interfaces:
      enum.RadialSelectorUiKey.Key:
        type: RadialSelectorMenuBUI
  - type: ActivatableUI
    key: enum.RadialSelectorUiKey.Key
    inHandsOnly: true
    requireActiveHand: false
  - type: ShortConstruction
    entries:
    - prototype: Grille
    - prototype: GrilleDiagonal
    - category:
        name: Railings
        icon:
          sprite: Structures/Walls/railing.rsi
          state: side
        entries:
        - prototype: Railing
        - prototype: RailingCorner
        - prototype: RailingRound
        - prototype: RailingCornerSmall
    - category:
        name: Glass
        icon:
          sprite: Objects/Materials/Sheets/glass.rsi
          state: rglass_3
        entries:
        - prototype: SheetRPGlass
        - prototype: SheetRPGlass0
        - prototype: SheetRUGlass
        - prototype: SheetRUGlass0
        - prototype: SheetRGlass
  - type: GuideHelp
    guides:
    - ExpandingRepairingStation

- type: entity
  parent: PartRodMetal
  id: PartRodMetal10
  name: steel rods
  suffix: 10
  components:
  - type: Tag
    tags:
    - RodMetal1
  - type: Sprite
    state: rod-mult
  - type: Stack
    count: 10

- type: entity
  parent: PartRodMetal
  id: PartRodMetal1
  name: steel rod
  suffix: Single
  components:
  - type: Tag
    tags:
    - RodMetal1
  - type: Sprite
    state: rod
  - type: Stack
    count: 1

- type: entity
  parent: PartRodMetal
  id: PartRodMetalLingering0
  suffix: Lingering, 0
  components:
  - type: Stack
    lingering: true
    count: 0

- type: entity
  parent: FloorTileItemSteel
  id: FloorTileItemSteelLingering0
  suffix: Lingering, 0
  components:
  - type: Stack
    lingering: true
    count: 0
