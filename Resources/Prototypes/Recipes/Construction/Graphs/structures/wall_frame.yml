- type: constructionGraph
  id: WallFrame
  start: start
  graph:
  - node: start
    edges:
    - to: wallFrame
      completed:
      - !type:SnapToGrid
        southRotation: true
      steps:
      - material: Steel
        amount: 3
        doAfter: 1

  - node: wallFrame
    entity: WallFrame
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 3
      - !type:DeleteEntity
      steps:
      - tool: Anchoring
        doAfter: 2

