- type: constructionGraph
  id: GrilleIron
  start: start
  graph:
  - node: start
    edges:
    - to: grille
      completed:
      - !type:SnapToGrid
        southRotation: true
      steps:
      - material: EmberRodIron
        amount: 2
        doAfter: 1

  - node: grille
    entity: GrilleIron
    edges:
    - to: start
      completed:
      - !type:AdminLog
        message: "A grille was cut"
      - !type:SpawnPrototype
        prototype: EmberRodIron1
        amount: 2
      - !type:DeleteEntity
      steps:
      - tool: Cutting
        doAfter: 0.25

  - node: grilleBroken
    entity: GrilleBrokenIron
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: EmberRodIron1
        amount: 1
      - !type:DeleteEntity
      steps:
      - tool: Cutting
    - to: grille
      steps:
      - material: EmberRodIron
        amount: 1
        doAfter: 0.5

