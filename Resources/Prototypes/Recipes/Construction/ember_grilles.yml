- type: construction
  name: iron grille
  id: GrilleIron
  graph: GrilleIron
  startNode: start
  targetNode: grille
  category: construction-category-structures
  description: A flimsy framework of iron rods.
  conditions:
  - !type:EmberNoWallInTile
    allowLowWalls: true
  - !type:TileNotBlocked
    failIfSpace: false
  icon:
    sprite: Ember/Structures/Grilles/grille.rsi
    state: grille
  objectType: Structure
  placementMode: SnapgridCenter
  canRotate: false

