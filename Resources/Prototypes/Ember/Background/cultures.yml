# How a character was raised. Ported from SierraBay12's /singleton/cultural_info/culture
# (code/modules/culture_descriptor/culture/), with the Russian additions from
# mods/expanded_culture_descriptor.
#
# Culture is deliberately not the same question as homeworld, and the pairs come apart often
# enough to be worth asking twice: a Martian tunneller who now lives on Luna is two different
# answers, and so is a Tajaran raised in a human household on Mars.
#
# Two things Bay hangs off this prototype are not carried across. Name generation keys off culture
# there, and we have no name generator; economic power scales loadout budgets there, and we have no
# economy. Both would be data that lies about being used.
#
# Species requirements read the axis as "raised among these people". The human planetary cultures
# therefore admit Reptilian and Tajaran - a xeno born in SCG space is raised by whoever is around,
# and the SCG has plenty of them even though it will not make them citizens. IPC and Diona are
# excluded from all of them: a positronic is assembled and trained rather than raised, and a diona
# gestalt is not raised by anyone at all. Both get their own entries in a later batch.
#
# Batch 1: the Sol system, plus the three answers that describe a way of living rather than a place.
# The rest of human space, the Confederation, and the non-human cultures follow.

# Sol. Where most of the crew grew up, so it sorts first.
