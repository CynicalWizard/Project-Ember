# Ahdomai carries two states, and which of them issued your papers is the whole of the tajaran
# entry on this axis. The clans are not here: they moved to the culture axis, where a clan says
# what a nationality says - where you are from and how you were raised - rather than who you are a
# subject of. Sierra keeps them as factions because Sierra's Ahdomai never unified; ours did, in a
# war, and that is exactly what stopped a clan from being a state.
#
# The exception is the clan the war was against.

- type: emberBackground
  id: EmberFactionAhdomaiCommonwealth
