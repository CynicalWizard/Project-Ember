# Who a character belongs to: a state, a hegemony, a clan, an owner. Ported from SierraBay12's
# /singleton/cultural_info/faction (code/modules/culture_descriptor/faction/), with the Russian
# additions from mods/expanded_culture_descriptor and mods/tajara.
#
# Bay's version of this axis also holds the services and the corporations. Ember records those on
# the branch and the employer, both chosen in the same screen, so porting them here would give the
# game three fields for one fact. Citizenship is what is left, and citizenship is what a passport
# is made of.
#
# Two departures from Bay worth knowing before editing:
#
# SCG citizenship is human-only, per canon section 5 - a xeno resident is a resident. That is a
# requirement rather than a sentence in a description because the player then meets the rule while
# building a character instead of reading about it.
#
# The positronic entries record an owner rather than a nation. Bay has an independent machine
# polity; Ember has an IPC as property of a state, a company or a person, which is the same premise
# that takes military rank away from them in the ranks system.
#
# EMBER-TODO: nothing selects these yet, same as the other three axes. The profile still carries
# the Contractors module's `nationality`, and the swap is one schema change and one migration, so
# it waits until all four axes have their data.


