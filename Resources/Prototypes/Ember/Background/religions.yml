# What a character believes, if anything. Ported from SierraBay12's
# /singleton/cultural_info/religion (code/modules/culture_descriptor/religion/), with the Russian
# translations from mods/expanded_culture_descriptor.
#
# One entry is ours. Canon section 5 founds the Gilgamesh Colonial Confederation on Old Believer
# communities that refused the Nikonian reform, and its Pact of Independence calls the Almighty as
# witness in the text itself. Folding that into "Christianity" would hide the largest political
# fact in human space on the one axis where it should be visible.
#
# Two of Bay's unathi faiths are not here. The Precursor cult rests on an ancient civilisation
# Ember does not have, and Aga-Eakhe belongs to the yeosa sub-race, which is not ported either -
# same cut as the yeosa cultures and factions.
#
# Only the Moghes clan faiths carry a species requirement, because they are clan practice rather
# than doctrine anyone may adopt. Everything else is open to every species: conversion happens, and
# the answers that mean "none of your business" have to be available to everyone by definition.
#
# EMBER-TODO: no tajaran faith exists here, because neither Bay nor the Sierra tajara mod wrote
# one. Authoring one is not porting, so it waits for a decision about whether Ember wants it.


