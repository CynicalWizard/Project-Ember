# Outside the SCG. Brahe and Iolaus were inside it until two years ago, and the timeline in
# "03 - Хронология" is what moved them: corporations installed a governor on Iolaus in 2324,
# corporate security broke up the protests in 2326, the referendum came in 2328, and in 2329 the
# planet left and the Frontier Alliance formed around it. Bay has both as firm SCG loyalists, which
# is the opposite of the canon and was worse than having no text at all.
#
# Kept selectable rather than removed. A crewman from a world that seceded two years ago, aboard the
# ship of the government it seceded from, is the most useful background in this file - and the Corps
