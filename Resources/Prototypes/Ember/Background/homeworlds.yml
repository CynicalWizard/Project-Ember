# Where a character lives. Ported from SierraBay12's /singleton/cultural_info/location
# (code/modules/culture_descriptor/location/), with the Russian additions from
# mods/expanded_culture_descriptor.
#
# This is the axis a passport hangs off, which is why it is being done first: Bay's passport is a
# loadout item that stamps itself from TAG_HOMEWORLD at spawn, and there is nothing for it to read
# until these exist.
#
# Batch 1 of the homeworld axis: the Sol system and the three answers that are not a place. The
# rest of human space, then Moghes, then the IPC and Diona origins follow in later batches - the
# translation is the slow half, since Bay's core files are English, the Sierra mod's additions are
# Russian, and no entry anywhere has both.
#
# Weights put Sol first because most characters are from Sol, and Bay's own ordering is file order
# - which is why Mars leads there, Mars being the base type rather than the obvious choice.
#
# Bay's /root is deliberately not ported. It is the homeworld of an independent machine polity,
# and Ember's lore has no such thing: an IPC is property of a state, a company or a person, not a
# vid with a country - see "06 - Правовой статус ксеновидов и ИПС" in the design vault, where the
# same premise is what takes military rank away from them entirely. Porting /root would smuggle
# Bay's reading in through the back door of a dropdown.
#
# What an IPC picks instead is a human world, which for a machine reads as where the chassis was
# built rather than where it lives. That is why the SCG entries below admit IPC alongside Human:
# a unit assembled on Mars is from Mars in the only sense that applies to it, and its owner is a
# separate question that the employer axis already answers.
#
# EMBER-TODO: nothing selects these yet. The profile still carries the Contractors module's
# `nationality`, and swapping it for the four axes is one change to the character schema and one
# database migration, so it waits until all four axes have their data.

