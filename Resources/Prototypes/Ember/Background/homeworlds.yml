# Batch 5: the Lordanian cluster, the Nyx system, and the rest of the Russian mod's additions.
# Every entry here has a Russian original and an English translation rather than the other way
# round - the Sierra mod wrote them and the core Bay files know none of them.
#
# Quig is deliberately not ported. It is a city built jointly for humans, Skrell and Resomi, and
# two of those three are not species in this game. A place can outlive its people, but a
# description that promises two species the player will never meet is a worse answer than leaving
# the entry out.
#
# Nyx is a corporate system rather than an SCG one: Brinkburn is run by gangs, Casser by Grayson,
# Roanok by NanoTrasen, Yuklit by Gilthari and Aether. Worth having precisely because the Corps
# contracts Grayson for prospecting - a rating from Casser has met the company that employs half
# the supply department.
#
# What Bay does not have and Ember does is a state within reach of it. Trasengate ended the era of
# companies writing their own rules out here: the system is still outside the SCG, but the firms
# working it are SCG-registered, so the mandate reaches the companies where it cannot reach the
# system. Roanok and Yuklit carry that; the other three are small enough that nobody has come to
# look. See "02 - Корпорации и Трейзенгейт" in the design vault.

