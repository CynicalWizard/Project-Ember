- type: startingGear
  id: EmberGearSCGRepresentative
  parent: HoPGear
  subGear:
  - EmberSubGearGovernment

# The one post aboard whose kit is not a service kit. The suit comes from the government sub-gear
# like the Representative's does; the coat and the badge are the office, and the badge is in the
# neck slot rather than pinned to the suit because showing it is the whole gesture.
- type: startingGear
  id: EmberGearFederalMarshal
  subGear:
  - EmberSubGearGovernment
  equipment:
    jumpsuit: ClothingUniformJumpsuitLawyerBlack
    outerClothing: ClothingOuterCoatDetective
    neck: EmberClothingNeckFederalPoliceBadge
    back: ClothingBackpackSatchel
    shoes: ClothingShoesBootsLaceup
    ears: ClothingHeadsetSecurity
    id: DetectivePDA
    # A scanner and no sidearm. Powers of arrest are not powers of entry, and the kit is the
    # clearest place to say so - the ship's security carries the guns, the marshal carries
    # the evidence.
    pocket1: ForensicScanner

