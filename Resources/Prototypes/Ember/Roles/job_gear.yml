# Round-start kit, one entry per post.
#
# Each of these inherits the kit the post used to point at directly, so the tools, the radio and
# the backpack come from the parent and are not copied here. What is added is the sub-gear list:
# the services this post admits, in the order they should be applied.
#
# The split is the whole point. Tools belong to the post - a hard hat is a fact about the work.
# The uniform belongs to the service, and is written once in branch_uniforms.yml rather than once
# per post per service. SierraBay12 does the same thing by writing out a whole second outfit per
# service on each job, which is where its `allowed_branches` list comes from and why its outfit
# files are as long as they are.
#
# The crew cut is always listed before the officer cut. Sub-gears apply in order and the later one
# wins, and the officer cut carries the rank requirement that decides whether it applies at all.
#
# EMBER-TODO: the parents are still vanilla kits, so the tools are vanilla tools. That is the same
# stopgap the `startingGear` lines in the job files carried before, moved one level down rather
# than resolved - what changes here is that the uniform is no longer part of it.

- type: startingGear
  id: EmberGearCaptain
  parent: CaptainGear
  subGear:
  - EmberSubGearCorps
  - EmberSubGearCorpsOfficer

