# Command aboard the SEV Ember.
#
# One file per department rather than one per job, which departs from the upstream layout. With
# forty-odd new jobs arriving at once, a department reads as a unit and reviews as a unit; the
# upstream convention would scatter that across forty files for no gain.
#
# EMBER-TODO: `startingGear` and `icon` point at existing vanilla content on purpose. A job does
# not need its own sprites to exist, and every one of these becomes a one-line change once the
# SCG uniforms are converted. Nothing else here is placeholder.
#
# **Authority aboard runs by billet, not by rank or by service.** This is the single most
# load-bearing sentence in the job files and it is easy to get backwards, because the rank data
# is so much more visible than the `supervisors` lines. The Captain commands the ship; everyone
# embarked answers to him whatever uniform they arrived in and whatever grade they hold. The
# Chief of Security is a Fleet officer with no career connection to a Corps captain and takes his
# orders anyway. The Senior Enlisted Advisor sits in this department while belonging to another
# service entirely. Neither is an anomaly — real navies work this way, and a ship that ran on
# seniority instead of billet would stop being a ship.
#
# So: `requirements` says who a character *is*. `supervisors` says who gives them orders. The two
# are independent, and where they seem to disagree, `supervisors` wins.
#
# The oversight department below is the exception that shows the rule. The Representative answers
# to nobody aboard precisely because he holds no billet aboard — he is not in the ship's
# organisation at all, which is a different thing from being high up in it.
#
# Note what does the gating. Command posts ask for almost nothing in skills — the Captain wants
# nine points' worth — because the thing that keeps people out is the commission, not the
# competence. Requiring a commission excludes every xeno species automatically, since none may
# hold a rank above E-5, and no separate rule is needed to say so. Technical departments are the
# other way round: their skill floors are the gate and their ranks are broad.
#
# A branch's own floor is not repeated in these jobs. Each service states what everyone in it is
# expected to know — the Corps `hauling`/`science`/`EVA`, the Fleet `hauling`/`weapons`/`EVA` —
# and that is merged in when requirements are checked. Only what a post asks for beyond its
# service is written down here.
#
# A post names a *band* of ranks, not one. Real billets are filled by whoever the service has:
# a ship of this size is commanded by a Commander or a Captain depending on who was available
# and how the appointment was written, and the bands overlap between neighbouring posts for the
# same reason. Pinning each job to a single grade would be a tidiness the service does not have.
#
# EMBER-TODO: acting appointments — a Lieutenant standing in as Executive Officer because the
# proper one is dead or unreachable — are a separate mechanic, not a wider band. Bay has the
# shape for it: `/datum/mil_rank/civ/acting` with `name_short_job_prefix`, which puts the prefix
# on the post rather than the person ("Acting Captain Ivanov", not "Capt Ivanov").

- type: department
  id: EmberCommand
  name: department-EmberCommand
  description: department-EmberCommand-description
  color: "#4b8fc4"
  weight: 20
  roles:
  - EmberCaptain
  - EmberExecutiveOfficer
  - EmberWatchOfficer
  - EmberSeniorEnlistedAdvisor
  - EmberLiaisonOfficer
  - EmberAdjutant

# Aboard, senior, and deliberately outside the ship's chain of command. Keeping these in their
# own department is not cosmetic: the department is what tells a player who answers to whom, and
# listing the government's observer under Command would say the Captain commands him, which is
# the one thing that is not true of the post.
#
# EMBER-TODO: the Federal Marshal belongs here too when Security is written. That supersedes the
# earlier plan to make the Marshal a second branch on the Investigator job — a job sits in one
# department, and putting a police officer under the head of security would say the head of
# security runs him.
- type: department
  id: EmberOversight
  name: department-EmberOversight
  description: department-EmberOversight-description
  color: "#c9a227"
  weight: 21
  roles:
  - EmberSCGRepresentative

- type: playTimeTracker
  id: JobEmberCaptain

- type: playTimeTracker
  id: JobEmberExecutiveOfficer

- type: playTimeTracker
  id: JobEmberWatchOfficer

- type: playTimeTracker
  id: JobEmberSeniorEnlistedAdvisor

- type: playTimeTracker
  id: JobEmberSCGRepresentative

- type: playTimeTracker
  id: JobEmberLiaisonOfficer

- type: playTimeTracker
  id: JobEmberAdjutant

# Commanding officer, and the only post aboard that answers to nobody on it. A Commander or a
# Captain: the ship is large but its complement is not, which is the shape of a submarine rather
# than a surface ship, and submarines of this size are commanded from either grade.
- type: job
  id: EmberCaptain
  name: job-name-ember-captain
  description: job-description-ember-captain
  playTimeTracker: JobEmberCaptain
  startingGear: CaptainGear
  icon: JobIconCaptain
  supervisors: job-supervisors-ember-observatory
  weight: 20
  requireAdminNotify: true
  joinNotifyCrew: true
  canBeAntag: false
  accessGroups:
  - AllAccess
  minSkills:
    bureaucracy: Basic
    science: Trained
    pilot: Trained
  requirements:
  - !type:CharacterBranchRequirement
    branches:
    - EmberBranchExpeditionaryCorps
  - !type:CharacterRankRequirement
    ranks:
    - EmberRankCorpsO5
    - EmberRankCorpsO6
  - !type:CharacterSkillRequirement

# Second in command. "Executive officer" is Fleet phrasing kept on purpose — the post came from
# the Fleet and the wording says so.
- type: job
  id: EmberExecutiveOfficer
  name: job-name-ember-executive-officer
  description: job-description-ember-executive-officer
  playTimeTracker: JobEmberExecutiveOfficer
  startingGear: HoPGear
  icon: JobIconHeadOfPersonnel
  supervisors: job-supervisors-ember-captain
  weight: 19
  requireAdminNotify: true
  canBeAntag: false
  accessGroups:
  - AllAccess
  minSkills:
    bureaucracy: Trained
    computer: Basic
    pilot: Basic
  requirements:
  - !type:CharacterBranchRequirement
    branches:
    - EmberBranchExpeditionaryCorps
  - !type:CharacterRankRequirement
    ranks:
    - EmberRankCorpsO3
    - EmberRankCorpsO5
  - !type:CharacterSkillRequirement

