    - EmberRankFleetE4
    - EmberRankFleetE5
  - !type:CharacterSkillRequirement

# Fleet medicine attached to the detachment rather than to the infirmary — the one who goes out
# with the boarding party and comes back with what is left of it. Under the Chief of Security for
# orders and under the Chief Medical Officer for anything clinical, which is a real friction and
# is meant to be.
#
# Enlisted, and that is the word rather than a slight: a corpsman is a rated specialist who goes
# forward, which is precisely what a commissioned physician does not do. The education argument
# is sound and it belongs to the infirmary — the Physician is a Corps officer and the ship's
# actual doctor. What the argument earns here is the floor: E-4 rather than E-3, because
# corpsman school is a rate like any other.
- type: job
  id: EmberCorpsman
  name: job-name-ember-corpsman
  description: job-description-ember-corpsman
  playTimeTracker: JobEmberCorpsman
  startingGear: ParamedicGear
  icon: JobIconBrigmedic
  supervisors: job-supervisors-ember-corpsman
  weight: 10
  access:
  - Security
  - Brig
  - Medical
  - Maintenance
  - External
  - Cryogenics
  minSkills:
    medical: Trained
    anatomy: Basic
    combat: Basic
  requirements:
  - !type:CharacterBranchRequirement
    branches:
    - EmberBranchFleet
  - !type:CharacterRankRequirement
    ranks:
    - EmberRankFleetE4
    - EmberRankFleetE5
    - EmberRankFleetE6
  - !type:CharacterSkillRequirement

# Learning the job by doing it under supervision. One grade rather than a band, which is the
# exception the rest of this file explains away: a trainee post is one step by definition, and
# Crewman Apprentice is that step. E-1 is not aboard — recruits are still ashore — so there is
# nothing below it to open.
- type: job
  id: EmberSecurityCadet
  name: job-name-ember-security-cadet
  description: job-description-ember-security-cadet
  playTimeTracker: JobEmberSecurityCadet
  startingGear: SecurityCadetGear
  icon: JobIconSecurityCadet
  supervisors: job-supervisors-ember-security
  weight: 5
  canBeAntag: false
  access:
  - Security
  - Brig
  - Maintenance
  - Cryogenics
  # No minSkills at all, and that is the post: a cadet is asked for nothing beyond being in the
  # Fleet. The branch floor still applies, so `CharacterSkillRequirement` is not a no-op here.
  requirements:
  - !type:CharacterBranchRequirement
    branches:
    - EmberBranchFleet
  - !type:CharacterRankRequirement
    ranks:
    - EmberRankFleetE2
  - !type:CharacterSkillRequirement
