# Сгенерировано вместе с полами. Спрайт берётся из беевского листа, а цвет — из материала,
# поэтому плитка в списке отличима от соседней.

- type: entity
  parent: FloorTileItemBase
  id: EmberFloorTileItemBase
  abstract: true
  components:
  - type: Sprite
    sprite: Ember/Objects/Tiles/tiles_offbay.rsi
  - type: Item
    heldPrefix: steel

