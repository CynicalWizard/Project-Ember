# Плитки для полов с бэя. Спрайт берётся из отдельного листа, а не из ванильного tile.rsi, поэтому
# спрайт в руках остаётся ванильным: своих inhand-состояний у беевского листа нет.

- type: entity
  parent: FloorTileItemBase
  id: EmberFloorTileItemBase
  abstract: true
  components:
  - type: Sprite
    sprite: Ember/Objects/Tiles/tiles_offbay.rsi

- type: entity
  name: grey techfloor tile
  parent: EmberFloorTileItemBase
  id: EmberFloorTileItemTechfloor
  components:
  - type: Sprite
    state: techfloor
  - type: Item
    heldPrefix: dark
  - type: FloorTile
    outputs:
    - Plating
    - EmberFloorTechfloor
  - type: Stack
    stackType: EmberFloorTileTechfloor

- type: entity
  name: grid techfloor tile
  parent: EmberFloorTileItemBase
  id: EmberFloorTileItemTechfloorGrid
  components:
  - type: Sprite
    state: techfloor-grid
  - type: Item
    heldPrefix: dark
  - type: FloorTile
    outputs:
    - Plating
    - EmberFloorTechfloorGrid
  - type: Stack
    stackType: EmberFloorTileTechfloorGrid

