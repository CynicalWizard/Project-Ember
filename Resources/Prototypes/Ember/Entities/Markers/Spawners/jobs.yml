# Round-start spawn points for the SEV Ember's posts, one per job.
#
# A job is not mappable without one of these: `SpawnPoint` with a `job_id` is what tells the
# round-start code where that post's holder appears. Forty-three jobs, forty-three markers, and
# no way around the repetition — the job id is the whole content of each.
#
# They carry their own suffix so the spawn menu can tell them apart from the vanilla ones, which
# are still present and still named "captain" and "engineer". That distinction disappears with
# the vanilla jobs; the suffix is the cheap way to survive the overlap until it does.
#
# EMBER-TODO: sprite states are borrowed from `Markers/jobs.rsi`, which has no Ember art in it.
# Several posts share a marker for want of a closer one — every command rating uses the head of
# personnel's, and three science posts use the scientist's. Harmless (a mapper reads the name,
# not the icon) and worth redoing when the department sprites land.

- type: entity
  id: SpawnPointEmberJobBase
  parent: SpawnPointJobBase
  abstract: true
  suffix: Ember Job Spawn

# Command

- type: entity
  id: SpawnPointEmberCaptain
  parent: SpawnPointEmberJobBase
  name: captain
  components:
  - type: SpawnPoint
    job_id: EmberCaptain
  - type: Sprite
    layers:
    - state: green
    - state: captain

