# EMBER-TODO: nothing issues any of these. They belong to the character rather than to the post,
# like the rank boards, but unlike the rank boards there is nothing on the character to read them
# off yet - a qualification is a skill floor that has been passed, and skills do not record which
# course was taken to reach them. The honest options are a per-badge skill threshold or an explicit
# list on the character, and that is a decision about skills rather than about clothing.
