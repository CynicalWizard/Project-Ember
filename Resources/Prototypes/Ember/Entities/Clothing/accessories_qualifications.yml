# Qualification badges of the SCG Expeditionary Corps and Fleet.
#
# A qualification is not a rank and not a department. It says the wearer passed a course, and it is
# the one piece of insignia aboard that describes what someone can actually do rather than where
# they sit. That makes it the natural thing to hang off skills once skills gate anything, which is
# why none of these are issued at spawn - see the EMBER-TODO at the end.
#
# The art is one grey badge for everyone, tinted per speciality on the wearer, with a purpose-drawn
# icon per speciality for the item in your hand. Bay's author left the reason in a comment: they
# were not going to put nine thousand coloured pixels in a sprite sheet. That split is what
# `equippedColor` exists for - tinting the item icon as well would multiply a colour into art that
# already has one.
#
# All of these are marked high-visibility, including the seven Bay left unflagged. Bay flags the
# voidsuit stripe and not the badge it duplicates, which reads as an oversight rather than a rule:
# the entire purpose of wearing a qualification is that somebody else can read it off you.

- type: entity
  abstract: true
  parent: EmberClothingAccessoryBase
  id: EmberClothingAccessorySkillBadgeBase
  name: "skill badge"
  description: "An Expeditionary Corps skill badge. This one is blank."
  components:
  - type: Sprite
    sprite: Ember/Clothing/Accessories/ec_badge_eva.rsi
  - type: EmberAccessory
    slot: Insignia
    flags: [ Removable, HighVisibility ]
    equippedState: equipped-ACCESSORY
    # Bay: on_rolled_down = ACCESSORY_ROLLED_NONE. It is worn on the chest, and the chest is bare
    # once the uniform is at the waist. This is the default here, so it is not repeated below.
    hideUnderOuterClothing: true

