# Accessories of the SCG Expeditionary Corps and Fleet, converted from SierraBay12.
#
# Eighty-six of them, and the rank insignia among them are what the rank system has been waiting
# for: `EmberRankPrototype.Accessories` has been empty on all forty ranks with an EMBER-TODO
# pointing at `accessory/solgov/rank/*`, which is this file.
#
# `equipped-ACCESSORY` is the sprite drawn on the wearer, `item` the one drawn on the garment's
# own icon. Bay draws both and calls the second `"[state]_tie"`; where it exists it is used, and
# where it does not the wearer sprite stands in — approximately, because that art is positioned
# for a body rather than for a folded uniform.
#
# EMBER-TODO: the department flashes carry `rolled-equipped-ACCESSORY` and
# `down-equipped-ACCESSORY`, converted from Bay's `_sleeves` and `_rolled` states, and nothing
# reads them yet. An accessory on a uniform with its sleeves up should follow the uniform, which
# means EmberAccessoryComponent needs to see the holder's EmberRollableClothingComponent. The
# art is here so that work is a code change and not another conversion pass.
#
# EMBER-TODO: no armour, temperature or speed values on any of these. Effects relay to
# accessories for free through InventoryRelayedEvent, so the plate carrier attachments will work
# the moment somebody fills the numbers in from Bay's own files.

- type: entity
  parent: EmberClothingAccessoryBase
  id: EmberClothingAccessoryAgenttag
  name: "SFP AGENT tag"
  description: "An armor tag with the words SFP AGENT printed in gold lettering on it."
  components:
  - type: Sprite
    sprite: Ember/Clothing/Accessories/agenttag.rsi
  - type: EmberAccessory
    slot: ArmorMisc
    equippedState: equipped-ACCESSORY
    # Bay draws this one for the garment's own icon; most accessories have no
    # such sprite and fall back to the on-mob art.
    itemState: item

- type: entity
  parent: EmberClothingAccessoryBase
  id: EmberClothingAccessoryComtag
  name: "SCG tag"
  description: "An armor tag with the words SOL CENTRAL GOVERNMENT printed in gold lettering on it."
  components:
  - type: Sprite
    sprite: Ember/Clothing/Accessories/comtag.rsi
  - type: EmberAccessory
    slot: ArmorMisc
    equippedState: equipped-ACCESSORY
    # Bay draws this one for the garment's own icon; most accessories have no
    # such sprite and fall back to the on-mob art.
    itemState: item

# The three department-insignia sprites are deliberately not entities here. Bay draws one blank
# patch per uniform cut and recolours it per department at runtime, so a converter that makes one
# entity per sprite produces three patches called "command insignia" and loses the other seven
# departments. They are written out by hand in accessories_departments.yml instead.

