# Outer clothing of the SCG Expeditionary Corps and Fleet, converted from SierraBay12.
#
# Service and dress jackets, webbing vests and the two greatcoats. The rank of the wearer is in
# the jacket here rather than on a shoulder board: Bay draws `blueservice`, `_snco`, `_off`,
# `_comm` and `_flag` as five garments, and they stay five.
#
# EMBER-TODO: `startingGear` does not reference any of these yet, and neither does a vendor.
# They exist as items so the uniform vendor and the branch kits have something to point at.
#
# EMBER-TODO: no in-hand sprites, and no armour or temperature values — everything here is
# cosmetic until the kit pass. Bay's numbers are in the same files these came from.

- type: entity
  parent: ClothingOuterBase
  id: EmberClothingOuterBlackservice
  name: "service jacket"
  description: "A uniform service jacket, plain and undecorated."
  components:
  - type: Sprite
    sprite: Ember/Clothing/OuterClothing/blackservice.rsi
  - type: Clothing
    sprite: Ember/Clothing/OuterClothing/blackservice.rsi
  # This cut sews the department patch somewhere else, so it takes a different sprite.
  - type: EmberAccessoryHolder
    insigniaCut: Service

