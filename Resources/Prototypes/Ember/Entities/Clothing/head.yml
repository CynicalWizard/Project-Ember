# Headgear of the SCG Expeditionary Corps and Fleet, converted from SierraBay12.
#
# Berets carry the department colour that a patch carries elsewhere — Bay draws a separate beret
# per department rather than one beret with an accessory, and that is kept: a beret's colour is
# the beret, not something sewn to it.
#
# Soft caps can be worn peak-backwards. That is vanilla's `Foldable` with a `flipped` prefix,
# and Bay's `_flipped` states drop straight into it.
#
# EMBER-TODO: `startingGear` does not reference any of these yet, and neither does a vendor.
# They exist as items so the uniform vendor and the branch kits have something to point at.
#
# EMBER-TODO: no in-hand sprites, and no armour or temperature values — everything here is
# cosmetic until the kit pass. Bay's numbers are in the same files these came from.

