- type: entity
  id: SurgeryStepBase
  categories: [ HideSpawnMenu ]
  components:
  - type: EmberSurgeryStep

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepOpenIncisionScalpel
  name: Cut with a scalpel
  categories: [ HideSpawnMenu ]
  components:
  - type: EmberSurgeryStep
    tool:
    - type: EmberScalpel
    add:
    - type: EmberIncisionOpen
    duration: 2
  - type: Sprite
    sprite: Ember/Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: EmberSurgeryDamageChangeEffect
    damage:
      types:
        Bloodloss: 10
    sleepModifier: 0.5
  - type: EmberSurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepClampBleeders
  name: Clamp the bleeders
  categories: [ HideSpawnMenu ]
  components:
  - type: EmberSurgeryStep
    tool:
    - type: EmberHemostat
    add:
    - type: EmberBleedersClamped
    duration: 2
  - type: Sprite
    sprite: Ember/Objects/Specific/Medical/Surgery/hemostat.rsi
    state: hemostat
  - type: EmberSurgeryDamageChangeEffect
    damage:
      types:
        Bloodloss: -5
    sleepModifier: 2

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepRetractSkin
  name: Retract the skin
  categories: [ HideSpawnMenu ]
  components:
  - type: EmberSurgeryStep
    tool:
    - type: EmberRetractor
    add:
    - type: EmberSkinRetracted
    duration: 2
  - type: Sprite
    sprite: Ember/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepSawBones
  name: Saw through bones
  categories: [ HideSpawnMenu ]
  components:
  - type: EmberSurgeryStep
    tool:
    - type: EmberBoneSaw
    add:
    - type: EmberRibcageSawed
    duration: 4
  - type: Sprite
    sprite: Ember/Objects/Specific/Medical/Surgery/circular-saw.rsi
    state: circular-saw
  - type: EmberSurgeryStepEmoteEffect

- type: entity
  parent: SurgeryStepBase
  id: SurgeryStepPriseOpenBones
  name: Prise the bones open
  categories: [ HideSpawnMenu ]
  components:
  - type: EmberSurgeryStep
    tool:
    - type: EmberRetractor
    add:
    - type: EmberRibcageOpen
    duration: 2
  - type: Sprite
    sprite: Ember/Objects/Specific/Medical/Surgery/retractor.rsi
    state: retractor

