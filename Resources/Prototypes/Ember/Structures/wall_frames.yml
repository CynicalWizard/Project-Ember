- type: entity
  id: WallFrame
  parent: BaseStructure
  name: low wall
  description: A low wall section which serves as the base of windows, amongst other things.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: Ember/Structures/WallFrames/wall_frame_offbay.rsi
  - type: Icon
    sprite: Ember/Structures/WallFrames/wall_frame_offbay.rsi
    state: frame
  - type: EmberProceduralStructure
    role: WallFrame
    material: EmberWallSteel
    stateBase: frame
    sprite: /Textures/Ember/Structures/WallFrames/wall_frame_offbay.rsi
  - type: CanBuildWindowOnTop
  - type: RCDDeconstructable
    cost: 4
    delay: 2
    fx: EffectRCDDeconstruct2
  - type: Construction
    graph: WallFrame
    node: wallFrame
    deconstructionTarget: start
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Physics
    bodyType: Static
  - type: Climbable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer

