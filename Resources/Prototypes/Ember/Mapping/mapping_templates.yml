          id: SpawnPointEmberResearcher
        - !type:MappingTemplatePrototype
          id: SpawnPointEmberLabTechnician
        - !type:MappingTemplatePrototype
          id: SpawnPointEmberFieldTeamLeader
        - !type:MappingTemplatePrototype
          id: SpawnPointEmberShuttlePilot
        - !type:MappingTemplatePrototype
          id: SpawnPointEmberFieldSpecialist
    - !type:MappingTemplatePrototype
      id: EmberJobsSupply
      children:
        - !type:MappingTemplatePrototype
          id: SpawnPointEmberSupplyChief
