# Employers: who pays the character, as opposed to who they serve in.
#
# Kept deliberately short. Ember is a government ship, not a corporate one, and a long list of
# corporations tells the player "this is a corporate world" before they have read a single
# description. Six entries plus "unemployed".
#
# The test for being here is not size but work: what does this employer's person do aboard? A
# corporation with no job to fill belongs on a label — Ward-Takahashi on the terminal bezels,
# Hephaestus on the sidearms, Gilthari on the bottles — where it does more for the world than a
# line in a dropdown ever would.
#
# Only the civilian branch may have an employer at all; see Content.Shared/Ember/Ranks.
#
# EMBER-TODO: Deimos Advanced Information Systems joins this list when there is a network for
# their people to run. Until then there is no job for them either.

# The state-owned company through which all corporate participation in state exploration is
# arranged. Founded as a joint platform, in practice a leash.
- type: employer
  id: ExpeditionaryCorpsOrganisation
  nameKey: employer_name_eco
  descriptionKey: employer_description_eco
  primaryColour: "#2f4858"
  secondaryColour: "#c9a227"

