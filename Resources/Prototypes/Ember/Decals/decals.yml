# Напольные декали Baystation12 и её модов.
#
# BYOND прячет в направлениях состояния не только повороты: у логотипов это части одного большого
# рисунка, у кромок пола — разные фаски для каждой стороны. Наши декали направлений не знают вовсе,
# они поворачивают одну картинку, поэтому такие наборы разложены на отдельные состояния при сборке
# ассета. Свёрнуты только те, где кадры действительно были поворотом одного рисунка.
#
# Категории в меню маппинга и в размещателе строятся из наследования, так что каждая — абстрактный
# корень без родителя.

# предупреждения, полосы и разметка опасных зон
