# Полы Baystation12 и SierraBay, которых у нас не было.
#
# Картинка тут — серая маска, ровно как на бэе, а цвет задаёт `color` у самого тайла: движок умножает
# его при сборке атласа. Поэтому шесть пород дерева — это шесть прототипов и один файл, а не шесть
# файлов, и следующий материал не добавит в репозиторий ни одной картинки.

- type: tile
  id: EmberFloorTechfloor
  name: ember-tiles-techfloor
  sprite: /Textures/Ember/Tiles/techfloor.png
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepHull
  itemDrop: EmberFloorTileItemTechfloor
  heatCapacity: 10000

- type: tile
  id: EmberFloorTechfloorGrid
  name: ember-tiles-techfloor-grid
  sprite: /Textures/Ember/Tiles/techfloor_grid.png
