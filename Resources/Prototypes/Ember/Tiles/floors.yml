# Сгенерировано. Полы Baystation12 и SierraBay плюс материальные семейства.
#
# Картинка — серая маска, цвет задаёт сам тайл, поэтому новый материал не добавляет ни одной
# картинки. Категории в меню маппинга строятся из наследования, как у декалей, так что каждая
# из них — абстрактный тайл без родителя.
#
# EMBER-TODO: материал у пола — пока только цвет. Прочность, температура плавления,
# теплопроводность и броня у материалов уже описаны и здесь не используются, поэтому
# урановый пол ничем не отличается от золотого. Упрётся в то же, что и повреждения
# пола: тайлу негде хранить состояние.

