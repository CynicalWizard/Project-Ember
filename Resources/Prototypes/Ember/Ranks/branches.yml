# Branches: the organisations a character can serve in.
#
# Ported from SierraBay12's maps/torch/torch_ranks.dm. The SEV Torch rather than the Sierra:
# the Sierra is a corporate ship whose "ranks" are employment statuses, while the Torch is an
# Expeditionary Corps vessel and its branch structure is the one we want.
#
# `minSkills` here is what everyone in the branch knows regardless of job — it answers "why
# does any crewman know how to work a voidsuit" without repeating it in thirty job prototypes.
#
# EMBER-TODO: `assistantJob` is unset on all of them. Bay points the two service branches at
# `/datum/job/crew`, which is the Crewman job; ours does not exist until the job pass.

- type: emberBranch
  id: EmberBranchExpeditionaryCorps
  name: ember-branch-corps-name
  shortName: ember-branch-corps-short
  emailDomain: ec.scg
  # Not an armed force. It explores, and that is the whole reason non-citizens can serve in it
  # while the Fleet stays shut to them.
  military: false
  minSkills:
    hauling: Basic
    science: Basic
    EVA: Basic
  speciesBlacklist:
  - Diona
  - Vox
  ranks:
  - EmberRankCorpsE1
  - EmberRankCorpsE3
  - EmberRankCorpsE5
  - EmberRankCorpsE7
  - EmberRankCorpsO1
  - EmberRankCorpsO3
  - EmberRankCorpsO5
  - EmberRankCorpsO6
  - EmberRankCorpsO8
  - EmberRankCorpsO10
  - EmberRankMachineAssigned
  - EmberRankOffDuty
  spawnRanks:
  # E-1 is not selectable on the Torch, but our junior technician and sanitation technician sit
  # there, so it is open here.
  - EmberRankCorpsE1
  - EmberRankCorpsE3
  - EmberRankCorpsE5
  - EmberRankCorpsE7
  - EmberRankCorpsO1
  - EmberRankCorpsO3
  - EmberRankCorpsO5
  - EmberRankCorpsO6
  - EmberRankMachineAssigned

- type: emberBranch
  id: EmberBranchFleet
  name: ember-branch-fleet-name
  shortName: ember-branch-fleet-short
  emailDomain: fleet.mil.scg
  military: true
  minSkills:
    hauling: Basic
    weapons: Basic
    EVA: Basic
  # The armed forces of the SCG take citizens. Xeno personnel are civilian persons rather than
  # citizens, so no branch of the armed forces is open to them.
  #
  # EMBER-TODO: this list names the species that exist today. The rule is meant to be enforced
  # in code off `military`, so that a species added later is covered without editing this file.
  #
  # EMBER-TODO: whether an IPC belongs here at all is unsettled. Property does not serve, it is
  # used — but a combat drone sets no precedent, whereas a combat drone with a rank does, and
  # a machine holds no graded rank in any case.
  speciesBlacklist:
  - Reptilian
  - Tajaran
  - Diona
  - Vox
  ranks:
  - EmberRankFleetE1
  - EmberRankFleetE2
  - EmberRankFleetE3
  - EmberRankFleetE4
  - EmberRankFleetE5
  - EmberRankFleetE6
  - EmberRankFleetE7
  - EmberRankFleetE8
  - EmberRankFleetE9
  - EmberRankFleetE9Command
  - EmberRankFleetE9Fleet
  - EmberRankFleetE9Force
  - EmberRankFleetE9OfTheFleet
  - EmberRankFleetO1
  - EmberRankFleetO2
  - EmberRankFleetO3
  - EmberRankFleetO4
  - EmberRankFleetO5
  - EmberRankFleetO6
  - EmberRankFleetO7
  - EmberRankFleetO8
  - EmberRankFleetO9
  - EmberRankFleetO10
  - EmberRankFleetO10Admiral
  - EmberRankMachineAssigned
  - EmberRankOffDuty
  spawnRanks:
  - EmberRankFleetE2
  - EmberRankFleetE3
  - EmberRankFleetE4
  - EmberRankFleetE5
  - EmberRankFleetE6
  - EmberRankFleetE7
  - EmberRankFleetE8
  - EmberRankFleetE9
  - EmberRankFleetE9Command
  - EmberRankFleetO1
  - EmberRankFleetO2
  - EmberRankFleetO3
  - EmberRankFleetO4
  - EmberRankFleetO5

- type: emberBranch
  id: EmberBranchSCGGovernment
  name: ember-branch-scg-government-name
  shortName: ember-branch-scg-government-short
  emailDomain: scg
  military: false
  # An agency that exercises the authority of the state is staffed by its citizens.
  speciesWhitelist:
  - Human
  ranks:
  - EmberRankSCGRepresentative
  - EmberRankSCGScientist
  - EmberRankFederalMarshal
  - EmberRankFederalAgent
  - EmberRankFederalSupervisor
  spawnRanks:
  - EmberRankSCGRepresentative
  - EmberRankSCGScientist
  - EmberRankFederalMarshal

- type: emberBranch
  id: EmberBranchCivilian
  name: ember-branch-civilian-name
  shortName: ember-branch-civilian-short
  emailDomain: freemail.net
  allowCustomEmail: true
  military: false
  # The only branch with an employer: contractors and company staff serve nobody, they are paid.
  allowsEmployer: true
  speciesBlacklist:
  - Vox
  ranks:
  - EmberRankCivilian
  - EmberRankContractor
  - EmberRankMachineAssigned
  - EmberRankOffDuty
  spawnRanks:
  - EmberRankCivilian
  - EmberRankContractor
  - EmberRankMachineAssigned
