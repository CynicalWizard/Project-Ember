# Ranks of the SCG Expeditionary Corps, ported from SierraBay12's maps/torch/torch_ranks.dm.
#
# The ladder is deliberately shorter than the Fleet's: E-1, E-3, E-5, E-7 and O-1, O-3, O-5,
# O-6, O-8, O-10. The gaps are not omissions, the Corps simply has no grades there.
#
# EMBER-TODO: `accessories` is empty everywhere here. The shoulder boards are
# `accessory/solgov/rank/ec/*` in maps/torch/items/clothing/solgov-accessory.dm and get
# converted in a later pass. The Corps has no specialty badge, so one accessory per rank.
#
# EMBER-TODO: the species blacklists below name the two xeno species that exist today. The rule
# behind them — a non-citizen never holds a commission — is meant to live in code, so that a
# species added later is covered without anyone remembering to edit this file.

