# Ranks of the SCG Fleet, ported from SierraBay12's maps/torch/torch_ranks.dm.
#
# Grades run E-1..E-9 at sortOrder 10..90 and O-1..O-10 at 110..200; alternate ranks of the
# same grade sit just above it so they sort adjacent without claiming the next grade.
#
# EMBER-TODO: `accessories` is empty everywhere here. The shoulder boards and rate badges are
# `accessory/solgov/rank/fleet/*` and `accessory/solgov/specialty/*` in
# maps/torch/items/clothing/solgov-accessory.dm, and get converted in a later pass. Fleet ranks
# carry two accessories, boards plus a specialty badge, unlike the Corps which carries one.

# Enlisted and non-commissioned. Per the Fleet's own lore, a "rate" — a qualification in your
# speciality — is only earned at E-4; E-1 through E-3 are apprentices learning in the field.

