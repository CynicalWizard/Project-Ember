# Ranks of the SCG Fleet, ported from SierraBay12's maps/torch/torch_ranks.dm.
#
# Grades run E-1..E-9 at sortOrder 10..90 and O-1..O-10 at 110..200; alternate ranks of the
# same grade sit just above it so they sort adjacent without claiming the next grade.
#

# `accessories` is the shoulder board each grade wears, converted from Bay's
# `accessory/solgov/rank/fleet/*`.
#
# The four alternate E-9s and the Fleet Admiral point at the board of their own grade: Bay draws
# no separate art for them, and a Command Master Chief wears a Master Chief's board with a
# different appointment behind it, which is correct rather than a shortcut.
#
# EMBER-TODO: Fleet grades also carry a specialty badge — `fleetspec`, `fleetpin_enlisted`,
# `fleetpin_officer`, `pin_pilot` — which is a qualification rather than a grade and so does not
# belong on the rank. It wants attaching from the job or the character's skills instead.

# Enlisted and non-commissioned. Per the Fleet's own lore, a "rate" — a qualification in your
# speciality — is only earned at E-4; E-1 through E-3 are apprentices learning in the field.

- type: emberRank
  id: EmberRankFleetE1
  accessories:
  - EmberClothingAccessoryFleetrankE1
  minAge: 18
  maxAge: 19
  name: ember-rank-fleet-e1-name
  shortName: ember-rank-fleet-e1-short
  sortOrder: 10

