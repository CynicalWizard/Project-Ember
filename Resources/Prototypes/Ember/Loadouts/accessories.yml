# Accessories attach to a uniform or coat rather than taking the neck slot, so they live in their
# own loadout category instead of competing with cloaks and mantles for LoadoutNeck.
# The ids are unchanged from when these lived in Loadouts/Generic/neck.yml so that saved
# character preferences keep working.

# Scarves
- type: loadout
  id: LoadoutNeckScarfStripedRed
  category: Accessories
  cost: 0
  items:
    - ClothingNeckScarfStripedRed
  requirements:
    - !type:CharacterItemGroupRequirement
      group: LoadoutAccessory

