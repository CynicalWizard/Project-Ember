# Сущность, которая рисует части мебели, лежащие ПОВЕРХ сидящего.
#
# У спрайта одна глубина отрисовки на все слои, поэтому спинка стула не может быть выше моба, пока сиденье
# ниже. Компаньон существует только ради этого: ни столкновений, ни взаимодействия, только спрайт на OverMobs.
# Сервер порождает его в MapInit, привязывает к стулу и переливает в него материал, обивку и признак «занято»;
# EmberProceduralFurnitureSystem на клиенте по этому признаку рисует подлокотники — они смыкаются только вокруг
# того, кто сидит.
#
# Ваниль решает ту же задачу грубее: BuckleSystem при развороте стула на север прячет сидящего за стул целиком,
# и в самом коде над этим стоит комментарий, что так делать не следовало. Работает это с одной стороны, а арт
# нарисован на четыре.

- type: entity
  id: EmberFurnitureOver
  categories: [ HideSpawnMenu ]
  name: furniture
  components:
  # Не якорится: компаньон висит на стуле, а якорь привязал бы его к тайлу и подрался бы с родителем.
  - type: Transform
  - type: Sprite
    drawdepth: OverMobs
    noRot: true
  - type: EmberProceduralFurniture
    baseState: chair
    drawsOver: true
