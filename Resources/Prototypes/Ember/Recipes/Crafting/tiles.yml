# Плитки собираются руками во вкладке «Плитки»: лист даёт четыре штуки, как на бэе.
# Беевские рецепты висят на стали и пластике; металлические — на своём же листе.

- type: construction
  name: iron floor tile
  id: EmberTileMetalIron
  graph: EmberTileMetalIron
  startNode: start
  targetNode: tile
  category: construction-category-tiles
  description: "Four iron station tiles."
  icon: { sprite: Ember/Objects/Tiles/tiles_offbay.rsi, state: steel }
  iconEntity: EmberFloorTileItemMetalIron
  objectType: Item

