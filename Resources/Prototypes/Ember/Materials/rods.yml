# Rods of every metal. Steel rods are vanilla PartRodMetal and are deliberately not repeated here.

- type: entity
  abstract: true
  parent: EmberMaterialStackBase
  id: EmberRodBase
  components:
  # Held sprites are the one part of a material stack that is not procedural. Bay is no better off: its in-hand
  # icons are ordinary drawn states (rods, sheet-metal, sheet-glass) that merely get the material colour
  # multiplied over them, so there is no paintable set to port.
  # EMBER-TODO: draw a greyscale in-hand mask in the Ember material sheet and tint it like everything else.
  # Until then every metal is carried like steel.
  - type: Item
    sprite: Objects/Materials/parts.rsi
    heldPrefix: rods

- type: entity
  parent: EmberRodBase
  id: EmberRodIron1
  name: iron rod
  description: Some rods. Can be used for building, or something.
  suffix: Single
  components:
  - type: Stack
    stackType: EmberRodIron
    count: 1
    baseLayer: base
    layerStates: [ rod, rod-mult, rod-max ]
  - type: EmberMaterialStack
    material: Iron
    renameEntity: false
    countedName: ember-rod-iron
    countedDescription: ember-rod-desc
  - type: Construction
    graph: EmberRodIron
    node: rod
  - type: FloorTile
    outputs:
    - EmberLatticeIron
    - EmberFloorReinforcedIron

- type: entity
  parent: EmberRodIron1
  id: EmberRodIron
  suffix: Full
  components:
  - type: Stack
    count: 50

