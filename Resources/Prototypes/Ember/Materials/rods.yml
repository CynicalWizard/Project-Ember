# Rods of every metal. Steel rods are vanilla PartRodMetal and are deliberately not repeated here.

- type: entity
  parent: EmberMaterialStackBase
  id: EmberRodIron1
  name: iron rod
  description: Some rods. Can be used for building, or something.
  suffix: Single
  components:
  - type: Stack
    stackType: EmberRodIron
    count: 1
    baseLayer: base
    layerStates: [ rod, rod-mult, rod-max ]
  - type: EmberMaterialStack
    material: Iron
    renameEntity: false
  - type: Construction
    graph: EmberRodIron
    node: rod
  # EMBER-TODO: lattice is a tile, and tile definitions bake their sprite, so every metal lays the same steel
  # one. It follows the material once the Bay floor set is ported and the tints are baked per material.
  - type: FloorTile
    outputs:
    - Lattice

- type: entity
  parent: EmberRodIron1
  id: EmberRodIron
  suffix: Full
  components:
  - type: Stack
    count: 50

