- type: entity
  abstract: true
  parent: BaseItem
  id: EmberMaterialStackBase
  description: A processed stack of material.
  components:
  - type: Sprite
    sprite: Ember/Objects/Materials/materials.rsi
    layers:
    - state: sheet
      map: ["base"]
  - type: Item
    sprite: Ember/Objects/Materials/materials.rsi
    size: Normal
  - type: Appearance
  - type: Tag
    tags:
    - Sheet
    - NoPaint
  - type: UserInterface
    interfaces:
      enum.RadialSelectorUiKey.Key:
        type: RadialSelectorMenuBUI
  - type: ActivatableUI
    key: enum.RadialSelectorUiKey.Key
    inHandsOnly: true
    requireActiveHand: false

- type: entity
  parent: EmberMaterialStackBase
  id: EmberIngotIron1
  name: iron ingot
  suffix: Single
  components:
  - type: Stack
    stackType: Iron
    count: 1
    baseLayer: base
    layerStates: [ ingot, ingot-mult, ingot-max ]
  - type: EmberMaterialStack
    material: Iron
  - type: ShortConstruction
    entries:
    - prototype: WallFrameIron

- type: entity
  parent: EmberIngotIron1
  id: EmberIngotIron
  suffix: Full
  components:
  - type: Stack
    count: 30

