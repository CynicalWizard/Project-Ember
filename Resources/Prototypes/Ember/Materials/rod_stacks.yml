# Rods are a material stack in Bay: any metal can be drawn into them, and the sheet they came from
# decides their colour, their name and how hard they are to work.

- type: stack
  id: EmberRodIron
  name: ember-stack-rod-iron
  icon: { sprite: /Textures/Ember/Objects/Materials/materials.rsi, state: rod }
  spawn: EmberRodIron1
  maxCount: 50

