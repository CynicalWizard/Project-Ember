- type: body
  id: Human
  name: "human"
  root: torso
  slots:
    head:
      part: HeadHuman
      connections:
      - torso
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
    torso:
      # EMBER-TODO: the torso sprite now covers the hips because SierraBay12 draws the groin as a
      # body part of its own and SS14 does not - the two were merged when the body art was ported
      # (see the copyright note in Mobs/Species/Human/parts.rsi/meta.json). Bay's surgery treats
      # the groin separately, so porting the medicine wants them split again: a GroinHuman part,
      # its own slot between torso and legs, and the sprite cut back out of torso_m/torso_f.
      part: TorsoHuman
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head # Ember
      organs:
        heart: OrganHumanHeart
        lungs: OrganHumanLungs
        stomach: OrganHumanStomach
        liver: OrganHumanLiver
        kidneys: OrganHumanKidneys
    right arm:
      part: RightArmHuman
      connections:
      - right hand
    left arm:
      part: LeftArmHuman
      connections:
      - left hand
    right hand:
      part: RightHandHuman
    left hand:
      part: LeftHandHuman
    right leg:
      part: RightLegHuman
      connections:
      - right foot
    left leg:
      part: LeftLegHuman
      connections:
      - left foot
    right foot:
      part: RightFootHuman
    left foot:
      part: LeftFootHuman