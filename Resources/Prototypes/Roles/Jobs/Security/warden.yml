- type: job
  id: Warden
  name: job-name-warden
  description: job-description-warden
  playTimeTracker: JobWarden
  requirements:
  # EMBER-TODO: probe. Security is a Fleet posting under the SCG structure, and this is here to
  # exercise the branch gate on a job that already exists. These vanilla jobs are replaced
  # wholesale by the Ember job pass, and this requirement goes with them.
  - !type:CharacterBranchRequirement
    branches:
    - EmberBranchFleet
  - !type:CharacterPlaytimeRequirement
    tracker: JobSecurityOfficer
    min: 43200 # DeltaV - 12 hrs
  - !type:CharacterPlaytimeRequirement
    tracker: JobDetective
    min: 14400 # DeltaV - 4 hours
  - !type:CharacterWhitelistRequirement
  - !type:CharacterTraitRequirement
    inverted: true
    traits:
    - Foreigner
    - ForeignerLight
    - Muted
    - Blindness
    - Pacifist
    - BrittleBoneDisease
  - !type:CharacterEmployerRequirement
    employers:
    - GraysonManufactories
    - NanoTrasen
  startingGear: WardenGear
  icon: "JobIconWarden"
  supervisors: job-supervisors-hos
  canBeAntag: false
  access:
  - Security
  - Armory
  - Maintenance
  - Service
  - External
  - Detective
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  afterLoadoutSpecial:
  - !type:ModifyEnvirosuitSpecial
    charges: 6
  - !type:ModifyEnvirohelmSpecial
    powerCell: PowerCellHigh

- type: startingGear
  id: WardenGear
  subGear:
  - WardenPlasmamanGear
  equipment:
    head: ClothingHeadHatWarden
    jumpsuit: ClothingUniformJumpsuitWarden
    back: ClothingBackpackSecurity
    shoes: ClothingShoesBootsCombatFilled
    eyes: ClothingEyesGlassesSecurity
    outerClothing: ClothingOuterCoatWarden
    id: WardenPDA
    ears: ClothingHeadsetAltSecurityRegular
    belt: ClothingBeltSecurityFilled

- type: startingGear
  id: WardenPlasmamanGear
  parent: BasePlasmamanSecurityGear
  equipment:
    jumpsuit: ClothingUniformEnvirosuitWarden
    head: ClothingHeadEnvirohelmWarden
    gloves: ClothingHandsGlovesEnviroglovesBlack
